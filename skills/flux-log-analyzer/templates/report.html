<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <style>
    /* ============================================================
       CSS 变量系统 —— 明暗主题
       ============================================================ */
    :root {
      /* 基础 — 纯白底 + 高对比文字 */
      --bg-primary: #fafafa;
      --bg-secondary: #ffffff;
      --text-primary: #111111;
      --text-secondary: #555555;
      --text-muted: #888888;

      /* 品牌红 — 用户指定色板 */
      --accent: #CD0000;
      --accent-light: #fff0f0;
      --accent-dark: #9B0000;
      --accent-gradient: linear-gradient(135deg, #9B0000 0%, #CD0000 50%, #E60000 100%);
      --accent-glow: 0 0 20px rgba(205, 0, 0, 0.25);

      /* 语义色 */
      --success: #1a7a3a;
      --success-bg: #edfaf1;
      --success-border: #a3e0b8;
      --warning: #c27805;
      --warning-bg: #fffaf0;
      --warning-border: #fcd88a;
      --error: #CD0000;
      --error-bg: #fff5f5;
      --error-border: #f5b8b8;
      --info: #B40000;
      --info-bg: #fff5f5;
      --info-border: #f5c0c0;

      /* 表面 */
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-bg-solid: #ffffff;
      --card-backdrop: blur(12px) saturate(180%);
      --card-shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
      --card-shadow-lg: 0 4px 16px rgba(0,0,0,0.1);
      --card-shadow-xl: 0 8px 32px rgba(0,0,0,0.14);

      --border: #e0e0e0;
      --border-light: #f0f0f0;
      --code-bg: #f5f5f5;
      --code-border: #e0e0e0;
      --timeline-line: #d8d8d8;

      /* 圆角 */
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --radius-full: 9999px;

      /* 动画 */
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --duration-fast: 150ms;
      --duration-base: 250ms;
      --duration-slow: 400ms;
    }

    body.dark {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --text-primary: #ffffff;
      --text-secondary: #cccccc;
      --text-muted: #888888;

      --accent: #FF0000;
      --accent-light: #1a0000;
      --accent-dark: #FF4444;
      --accent-gradient: linear-gradient(135deg, #B40000 0%, #E60000 50%, #FF0000 100%);
      --accent-glow: 0 0 28px rgba(255, 0, 0, 0.35);

      --success: #4ade80;
      --success-bg: #002210;
      --success-border: #0d4a20;
      --warning: #fbbf24;
      --warning-bg: #1f1000;
      --warning-border: #5c3500;
      --error: #FF4444;
      --error-bg: #1a0000;
      --error-border: #4a1010;
      --info: #FF3333;
      --info-bg: #1a0000;
      --info-border: #4a1515;

      --card-bg: rgba(10, 10, 10, 0.85);
      --card-bg-solid: #0a0a0a;
      --card-backdrop: blur(16px) saturate(120%);
      --card-shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
      --card-shadow: 0 2px 8px rgba(0,0,0,0.5);
      --card-shadow-lg: 0 4px 16px rgba(0,0,0,0.6);
      --card-shadow-xl: 0 8px 32px rgba(0,0,0,0.7);

      --border: #2a2a2a;
      --border-light: #1a1a1a;
      --code-bg: #050505;
      --code-border: #1a1a1a;
      --timeline-line: #1a1a1a;
    }

    /* ============================================================
       全局样式
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      font-family: 'Microsoft YaHei', '微软雅黑', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(205, 0, 0, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(205, 0, 0, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      transition: background-color var(--duration-slow) var(--ease-out),
                  color var(--duration-slow) var(--ease-out);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    ::selection { background: var(--accent-light); color: var(--accent); }

    /* ============================================================
       顶部导航栏 .top-bar
       ============================================================ */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 24px;
      background: var(--card-bg);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
      border-bottom: 1px solid var(--border);
      transition: all var(--duration-base) var(--ease-out);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-block {
      width: 32px;
      height: 32px;
      background: var(--accent-gradient);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      font-weight: 700;
      box-shadow: var(--accent-glow);
    }

    .top-bar-left h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .top-bar-right { display: flex; align-items: center; gap: 8px; }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all var(--duration-fast) var(--ease-out);
      color: var(--text-secondary);
    }
    .theme-toggle:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.05);
    }

    /* ============================================================
       文件信息栏 .file-info-bar
       ============================================================ */
    .file-info-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 24px;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-light);
    }

    .info-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      color: var(--text-secondary);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
    }
    .info-tag .tag-label { font-weight: 600; color: var(--text-primary); }

    /* ============================================================
       选项卡导航 .tab-nav
       ============================================================ */
    .tab-nav {
      position: sticky;
      top: 56px;
      z-index: 99;
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 12px 24px;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-light);
      transition: background-color var(--duration-slow) var(--ease-out);
    }

    .tab-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border: none;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--duration-base) var(--ease-out);
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-primary);
      background: var(--card-bg);
      box-shadow: var(--card-shadow-sm);
    }

    .tab-btn.active {
      color: #ffffff;
      background: var(--accent-gradient);
      box-shadow: var(--accent-glow), var(--card-shadow);
      font-weight: 600;
    }

    .tab-btn .tab-icon { font-size: 0.95rem; }

    /* ============================================================
       内容区域 .content-area
       ============================================================ */
    .content-area {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px 60px;
      transition: opacity var(--duration-base) var(--ease-out);
    }

    .animate-fade-in {
      animation: fadeSlideIn var(--duration-base) var(--ease-out);
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       统计卡片 .stat-cards
       ============================================================ */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      position: relative;
      overflow: hidden;
      padding: 24px;
      background: var(--card-bg);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      transition: all var(--duration-base) var(--ease-out);
      cursor: default;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--card-shadow-lg);
    }

    .stat-card.stat-blue::before { background: linear-gradient(90deg, #9B0000, #E60000); }
    .stat-card.stat-green::before { background: linear-gradient(90deg, #1a7a3a, #2ea84a); }
    .stat-card.stat-orange::before { background: linear-gradient(90deg, #c27805, #e8950a); }
    .stat-card.stat-red::before { background: linear-gradient(90deg, #B40000, #FF0000); }

    .stat-number {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .stat-card.stat-blue .stat-number { color: #B40000; }
    .stat-card.stat-green .stat-number { color: #1a7a3a; }
    .stat-card.stat-orange .stat-number { color: #c27805; }
    .stat-card.stat-red .stat-number { color: #CD0000; }

    .stat-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .stat-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    body.dark .stat-card.stat-blue .stat-number { color: #FF4444; }
    body.dark .stat-card.stat-green .stat-number { color: #4ade80; }
    body.dark .stat-card.stat-orange .stat-number { color: #fbbf24; }
    body.dark .stat-card.stat-red .stat-number { color: #FF6666; }

    /* ============================================================
       文件信息卡片 .info-cards
       ============================================================ */
    .info-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .info-card {
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
      box-shadow: var(--card-shadow-sm);
      transition: all var(--duration-fast) var(--ease-out);
    }
    .info-card:hover {
      box-shadow: var(--card-shadow);
      border-color: var(--accent);
    }

    .info-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ============================================================
       时间线 .timeline
       ============================================================ */
    .timeline {
      position: relative;
      padding-left: 44px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--timeline-line);
      border-radius: var(--radius-full);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 20px;
    }

    .timeline-marker {
      position: absolute;
      left: -29px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--bg-primary);
      box-shadow: 0 0 0 3px currentColor;
      z-index: 2;
    }

    .timeline-marker.type-outside { background: #B40000; color: rgba(180, 0, 0, 0.2); }
    .timeline-marker.type-start { background: #1a7a3a; color: rgba(26, 122, 58, 0.2); }
    .timeline-marker.type-in { background: #c27805; color: rgba(194, 120, 5, 0.2); }
    .timeline-marker.type-error { background: #E60000; color: rgba(230, 0, 0, 0.25); }
    .timeline-marker.type-success { background: #777777; color: rgba(119, 119, 119, 0.18); }

    .timeline-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 4px;
      word-break: break-all;
      white-space: normal;
    }

    .timeline-content {
      background: var(--card-bg);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--card-shadow-sm);
      transition: all var(--duration-fast) var(--ease-out);
    }
    .timeline-content:hover {
      box-shadow: var(--card-shadow);
    }

    .timeline-header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .type-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
    }

    .module-badge, .action-badge, .result-badge {
      display: inline-block;
      padding: 3px 8px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.73rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .step-badge {
      display: inline-block;
      padding: 3px 10px;
      background: var(--accent-gradient);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }

    .step-ops-count {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .result-success {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .result-error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error);
    }

    .result-pending {
      background: var(--warning-bg);
      border-color: var(--warning-border);
      color: var(--warning);
    }

    .step-time-info {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .type-success {
      background: var(--success);
    }

    .type-error {
      background: var(--error);
    }

    .type-pending {
      background: var(--warning);
    }

    /* 自定义服务步骤卡片 */
    .service-steps-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .service-step-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all var(--duration-base) var(--ease-out);
      box-shadow: var(--card-shadow-sm);
    }

    .service-step-card:hover {
      box-shadow: var(--card-shadow-lg);
    }

    /* 卡片头部 —— 双行布局 */
    .step-header {
      display: flex;
      flex-direction: column;
      padding: 14px 18px 12px;
      cursor: pointer;
      background: var(--bg-secondary);
      border-bottom: 1px solid transparent;
      transition: all var(--duration-fast) var(--ease-out);
      gap: 8px;
    }
    .service-step-card.expanded .step-header {
      border-bottom-color: var(--border);
    }
    .step-header:hover {
      background: var(--accent-light);
    }

    /* 头部上行：步骤号 + 描述 + 展开图标 */
    .step-header-row1 {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step-header-row1 .step-desc {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* 头部下行：时间范围 + 耗时 + 操作数 */
    .step-header-row2 {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .step-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .step-meta-item .meta-icon {
      opacity: 0.45;
      display: flex;
      align-items: center;
    }
    .step-time-range {
      font-family: 'SF Mono', monospace;
      font-size: 0.73rem;
    }

    .step-toggle-icon {
      font-size: 0.7rem;
      color: var(--text-muted);
      transition: transform var(--duration-fast) var(--ease-out);
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }
    .service-step-card.expanded .step-toggle-icon {
      transform: rotate(90deg);
    }

    /* 判断结果区块 */
    .judge-section {
      margin: 16px 0;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .judge-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .judge-condition {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .judge-condition code {
      font-family: 'SF Mono', monospace;
      background: var(--code-bg);
      padding: 2px 8px;
      border-radius: var(--radius-xs);
      font-size: 0.8rem;
    }

    .judge-result {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .judge-result.true {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success-border);
    }

    .judge-result.false {
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid var(--error-border);
    }

    .step-toggle-icon {
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform var(--duration-fast) var(--ease-out);
    }

    .step-duration {
      display: inline-block;
      padding: 2px 8px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-secondary);
      font-family: 'SF Mono', monospace;
    }

    .step-detail {
      padding: 18px;
    }

    .step-time-info {
      display: flex;
      gap: 20px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
      padding: 10px 14px;
      background: var(--code-bg);
      border-radius: var(--radius-sm);
    }

    .step-time-info strong {
      color: var(--text-primary);
    }

    /* 操作列表 */
    .step-operations {
      margin-top: 16px;
    }

    .operations-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
    }

    .operation-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px;
      margin-bottom: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--border);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .operation-item:hover {
      border-left-color: var(--accent);
      background: var(--accent-light);
    }

    .operation-item.sql { border-left-color: #1a73e8; }
    .operation-item.dml { border-left-color: #f57c00; }
    .operation-item.sp { border-left-color: #9c27b0; }
    .operation-item.event { border-left-color: var(--accent); }

    .op-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .op-icon {
      display: flex;
      align-items: center;
      color: var(--text-muted);
    }

    .op-type {
      display: inline-block;
      padding: 1px 6px;
      border-radius: var(--radius-xs);
      font-size: 0.7rem;
      font-weight: 600;
      font-family: 'SF Mono', monospace;
    }

    .op-type.sql-type-select { background: #e8f4fd; color: #1a73e8; }
    .op-type.sql-type-insert { background: #edfaf1; color: #1a7a3a; }
    .op-type.sql-type-update { background: #fff8e1; color: #f57c00; }
    .op-type.sql-type-delete { background: #fce4ec; color: #c62828; }
    .op-type.dml-type { background: #fff3e0; color: #e65100; }
    .op-type.sp-type { background: #f3e5f5; color: #7b1fa2; }
    .op-type.event-type { background: var(--accent-light); color: var(--accent); }

    body.dark .op-type.sql-type-select { background: #0d2137; color: #64b5f6; }
    body.dark .op-type.sql-type-insert { background: #002210; color: #4ade80; }
    body.dark .op-type.sql-type-update { background: #2a1f00; color: #ffcc80; }
    body.dark .op-type.sql-type-delete { background: #2a0000; color: #ef9a9a; }
    body.dark .op-type.dml-type { background: #1a0f00; color: #ffb74d; }
    body.dark .op-type.sp-type { background: #1a0022; color: #ce93d8; }
    body.dark .op-type.event-type { background: #1a0000; color: #ff8a80; }

    .op-line {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .op-content {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .op-sql {
      font-family: 'SF Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-primary);
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: var(--radius-xs);
      max-width: 100%;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .op-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'SF Mono', monospace;
    }

    .op-result {
      font-size: 0.72rem;
      color: var(--success);
      font-weight: 500;
    }

    /* 前后置操作详情样式 */
    .op-ext-params, .op-sp-invoke, .op-sp-calls {
      margin-top: 6px;
      padding: 6px 10px;
      background: var(--code-bg);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xs);
      font-size: 0.78rem;
    }

    .op-params-label, .op-sp-label {
      display: inline-block;
      font-weight: 600;
      color: var(--text-primary);
      margin-right: 6px;
    }

    .op-params-value, .op-sp-value {
      font-family: 'SF Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-secondary);
      word-break: break-all;
      white-space: pre-wrap;
    }

    .op-sp-calls {
      margin-top: 8px;
    }

    .op-sp-call-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .op-sp-call-item:last-child {
      border-bottom: none;
    }

    .op-sp-name {
      font-weight: 700;
      color: var(--accent);
      font-family: 'SF Mono', monospace;
      font-size: 0.8rem;
    }

    .op-sp-input, .op-sp-output {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-family: 'SF Mono', monospace;
      word-break: break-all;
    }

    .op-sp-output {
      color: var(--success);
    }

    /* ============================================================
       SQL 表格 .sql-table
       ============================================================ */
    .sql-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 0;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 0.85rem;
      transition: all var(--duration-fast) var(--ease-out);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .sort-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
    }
    .sort-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }

    .sql-count {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .sql-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.82rem;
    }

    .sql-table thead th {
      position: sticky;
      top: 116px;
      background: var(--code-bg);
      padding: 10px 14px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
      z-index: 1;
    }

    .sql-table thead th:nth-child(6),
    .sql-table thead th:last-child {
      text-align: left;
    }

    .sql-table tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-secondary);
      text-align: center;
    }

    .sql-table tbody td.table-name,
    .sql-table tbody td.sql-preview {
      text-align: left;
    }

    .sql-table tbody tr {
      transition: all var(--duration-fast) var(--ease-out);
      cursor: pointer;
    }

    .sql-table tbody tr:hover {
      background: var(--accent-light);
    }

    .sql-table tbody tr.slow-query {
      background: var(--error-bg);
    }

    .sql-table .sql-num {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.78rem;
    }

    .sql-table .slow-time {
      color: var(--error);
      font-weight: 700;
    }

    .sql-type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }

    .sql-type-badge:hover {
      transform: scale(1.05);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .sql-type-select { background: #e8f4fd; color: #1a73e8; }
    .sql-type-insert { background: #edfaf1; color: #1a7a3a; }
    .sql-type-update { background: #fff8e1; color: #f57c00; }
    .sql-type-delete { background: #fce4ec; color: #c62828; }

    body.dark .sql-type-select { background: #0d2137; color: #64b5f6; }
    body.dark .sql-type-insert { background: #002210; color: #4ade80; }
    body.dark .sql-type-update { background: #2a1f00; color: #ffcc80; }
    body.dark .sql-type-delete { background: #2a0000; color: #ef9a9a; }

    /* SQL 类型筛选按钮 */
    .sql-filter-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .sql-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }

    .sql-filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .sql-filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .sql-filter-btn .filter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .sql-filter-btn .filter-dot.dot-select { background: #1a73e8; }
    .sql-filter-btn .filter-dot.dot-insert { background: #1a7a3a; }
    .sql-filter-btn .filter-dot.dot-update { background: #f57c00; }
    .sql-filter-btn .filter-dot.dot-delete { background: #c62828; }

    body.dark .sql-filter-btn .filter-dot.dot-select { background: #64b5f6; }
    body.dark .sql-filter-btn .filter-dot.dot-insert { background: #4ade80; }
    body.dark .sql-filter-btn .filter-dot.dot-update { background: #ffcc80; }
    body.dark .sql-filter-btn .filter-dot.dot-delete { background: #ef9a9a; }

    .table-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .sql-preview code {
      font-family: 'Microsoft YaHei', '微软雅黑', 'Courier New', Consolas, monospace;
      font-size: 0.78rem;
      color: var(--text-secondary);
      word-break: break-all;
      white-space: normal;
      display: block;
    }

    .sql-preview {
      max-width: 300px;
      overflow: hidden;
    }

    .sql-detail-row td {
      padding: 0 !important;
    }

    .sql-detail-content {
      padding: 20px;
      background: var(--code-bg);
      border-top: 1px solid var(--border);
    }

    .sql-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ============================================================
       代码块 .code-block
       ============================================================ */
    .code-block {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: var(--radius-md);
      padding: 20px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-primary);
      text-align: left;
    }

    /* 语法高亮 */
    .sql-keyword { color: #CD0000; font-weight: 600; }
    .sql-string { color: #1a7a3a; }
    .sql-number { color: #c27805; }

    .json-key { color: #B40000; font-weight: 500; }
    .json-string { color: #1a7a3a; }
    .json-number { color: #c27805; }
    .json-boolean { color: #D73A47; }
    .json-null { color: #888888; font-style: italic; }

    .stack-caused { color: #E60000; font-weight: 700; }
    .stack-our-code { color: #B40000; }

    /* 暗色 */
    body.dark .sql-keyword { color: #FF4444; }
    body.dark .sql-string { color: #4ade80; }
    body.dark .sql-number { color: #fbbf24; }
    body.dark .json-key { color: #FF5555; }
    body.dark .json-string { color: #4ade80; }
    body.dark .json-number { color: #fbbf24; }
    body.dark .json-boolean { color: #FF6666; }
    body.dark .json-null { color: #888888; }
    body.dark .stack-caused { color: #FF5555; }
    body.dark .stack-our-code { color: #FF4444; }

    /* ============================================================
       异常卡片 .error-card
       ============================================================ */
    .error-card {
      background: var(--card-bg);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
      border: 1px solid var(--error-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .error-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--error-bg);
      border-bottom: 1px solid var(--error-border);
    }

    .error-num {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--error);
    }

    .error-time {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .error-section {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .error-label {
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .error-code {
      display: inline-block;
      padding: 4px 10px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: var(--radius-sm);
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--error);
      font-weight: 600;
    }

    .error-type {
      display: inline-block;
      padding: 4px 10px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: var(--radius-sm);
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--error);
      font-weight: 600;
    }

    .error-message {
      display: inline-block;
      padding: 4px 10px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-primary);
    }

    .error-root {
      display: inline-block;
      padding: 4px 10px;
      background: var(--code-bg);
      border-radius: var(--radius-sm);
      font-family: monospace;
      font-size: 0.82rem;
      color: var(--text-primary);
    }

    .chain-text {
      margin-top: 6px;
      padding: 12px 16px;
      background: var(--code-bg);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      line-height: 1.7;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }

    /* ============================================================
       SP 调用卡片 .sp-call-card
       ============================================================ */
    .sp-call-card {
      margin-top: 12px;
      padding: 16px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .sp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sp-name {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-primary);
      font-family: 'SF Mono', monospace;
    }

    .sp-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .sp-params, .sp-return {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .sp-params:last-child, .sp-return:last-child {
      margin-bottom: 0;
    }

    .sp-params code, .sp-return .sp-return-value {
      display: block;
      margin-top: 6px;
      padding: 10px 12px;
      background: var(--card-bg-solid);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .sp-return-value {
      font-family: monospace;
      color: var(--error);
      font-weight: 600;
    }

    /* ============================================================
       配置卡片 .config-cards
       ============================================================ */
    .config-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .config-card {
      padding: 20px;
      background: var(--card-bg);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow-sm);
      transition: all var(--duration-fast) var(--ease-out);
    }
    .config-card:hover {
      box-shadow: var(--card-shadow);
      border-color: var(--accent);
    }

    .config-id {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .config-default {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .config-match {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ============================================================
       登录信息 .login-info-grid
       ============================================================ */
    .login-info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 20px;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
    }

    .login-field {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .login-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .login-value {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-primary);
      text-align: right;
      max-width: 60%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ============================================================
       可折叠区域
       ============================================================ */
    .collapsible-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      user-select: none;
      transition: color var(--duration-fast);
    }
    .collapsible-header:hover { color: var(--accent); }

    .collapse-icon {
      font-size: 0.6rem;
      transition: transform var(--duration-fast) var(--ease-out);
      display: inline-block;
    }
    .collapse-icon.expanded { transform: rotate(90deg); }

    .collapsible-content.collapsed { display: none; }

    /* ============================================================
       复制按钮 .copy-btn
       ============================================================ */
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
      white-space: nowrap;
    }
    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }
    .copy-btn.copied {
      border-color: var(--success);
      color: var(--success);
      background: var(--success-bg);
    }

    /* ============================================================
       卡片组件 / AI 摘要 / 分组标题 / 空状态
       ============================================================ */
    .card {
      background: var(--card-bg);
      backdrop-filter: var(--card-backdrop);
      -webkit-backdrop-filter: var(--card-backdrop);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      padding: 16px 20px;
      font-weight: 700;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-primary);
    }

    .card-body {
      padding: 20px;
    }

    .ai-summary-card {
      border-left: 4px solid var(--accent);
    }

    .ai-summary-text {
      font-size: 0.85rem;
      line-height: 1.8;
      color: var(--text-secondary);
      white-space: pre-wrap;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state.success-state {
      color: var(--success);
    }

    /* ============================================================
       辅助工具类
       ============================================================ */
    .flex-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .flex-wrap { flex-wrap: wrap; }

    .gap-sm { gap: 6px; }
    .gap-md { gap: 12px; }
    .gap-lg { gap: 20px; }

    .mt-sm { margin-top: 8px; }
    .mt-md { margin-top: 16px; }
    .mt-lg { margin-top: 24px; }
    .mb-sm { margin-bottom: 8px; }
    .mb-md { margin-bottom: 16px; }
    .mb-lg { margin-bottom: 24px; }

    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }
    .text-accent { color: var(--accent); }
    .text-success { color: var(--success); }
    .text-warning { color: var(--warning); }
    .text-error { color: var(--error); }

    .text-sm { font-size: 0.85rem; }
    .text-xs { font-size: 0.75rem; }
    .text-mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace; }
    .text-bold { font-weight: 600; }

    .divider {
      border: none;
      border-top: 1px solid var(--border-light);
      margin: 20px 0;
    }

    /* ============================================================
       动画
       ============================================================ */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* ============================================================
       响应式
       ============================================================ */
    @media (max-width: 900px) {
      .stat-cards { grid-template-columns: repeat(2, 1fr); }
      .info-cards { grid-template-columns: repeat(2, 1fr); }
      .login-info-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .stat-cards { grid-template-columns: 1fr; }
      .info-cards { grid-template-columns: 1fr; }
      .content-area { padding: 16px; }
      .tab-nav { padding: 8px 12px; justify-content: flex-start; overflow-x: auto; }
      .tab-btn { padding: 6px 14px; font-size: 0.78rem; }
      .timeline { padding-left: 36px; }
      .timeline-marker { left: -21px; width: 10px; height: 10px; }

      .sql-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .sql-count {
        margin-left: 0;
        text-align: right;
      }

      .config-cards { grid-template-columns: 1fr; }

      .top-bar { padding: 0 16px; }
      .file-info-bar { padding: 10px 16px; }

      .stat-number { font-size: 2rem; }
      .error-card { overflow-x: auto; }
    }

  </style>
</head>
<body>

    <span class="info-tag"><span class="tag-label">总行数</span> 待加载</span>

        </svg>

    </button>
    <button class="tab-btn" data-tab="prepost" role="tab">

          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>

    <button class="tab-btn" data-tab="service" role="tab">

          <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
